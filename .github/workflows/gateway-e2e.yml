name: Gateway Full-Stack E2E

on:
  push:
    paths:
      - "gateway/**"
      - "backend/**"
      - ".github/workflows/gateway-e2e.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "backend/**"
      - ".github/workflows/gateway-e2e.yml"
  workflow_dispatch:

jobs:
  security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests psycopg2-binary cryptography

      - name: Start PostgreSQL and Keycloak
        run: |
          docker compose -f gateway/e2e/compose.yml up -d \
            --wait postgres keycloak

      - name: Generate Kong JWT configuration
        run: python gateway/e2e/bootstrap.py

      - name: Start application stack
        run: |
          docker compose -f gateway/e2e/compose.yml up \
            -d --build --wait kong

      - name: Execute security E2E
        env:
          E2E_DATABASE_URL: postgresql://pfp_e2e:e2e_only_password@127.0.0.1:15432/finance_e2e_db
        run: |
          pytest -v gateway/e2e/test_security_e2e.py

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f gateway/e2e/compose.yml ps -a
          docker compose -f gateway/e2e/compose.yml logs --tail=100

      - name: Cleanup
        if: always()
        run: |
          docker compose -f gateway/e2e/compose.yml down -v --remove-orphans

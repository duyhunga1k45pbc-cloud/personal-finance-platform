name: System Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  system-e2e:
    name: Real browser system E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-test.txt

      - name: Test live E2E runner
        run: python -m pytest -q gateway/e2e/test_run_live_e2e_unit.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ai-service/go.mod
          cache-dependency-path: ai-service/go.mod

      - name: Test AI service
        working-directory: ai-service
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real browser E2E and verify cleanup
        run: python3 gateway/e2e/run_live_e2e.py

      - name: Upload sanitized E2E artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pfp-system-e2e-artifacts
          path: /tmp/pfp-live-e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7

_format_version: "3.0"
_transform: true

services:
  - name: pfp-api
    url: http://pfp-api-test:8000
    routes:
      - name: pfp-accounts-authz
        paths:
          - /accounts
        strip_path: false
        plugins:
          - name: pfp-authz
            config:
              authz_url: http://pfp-api-test:8000/internal/gateway/authorize
              shared_secret: "{vault://env/gateway-authz-secret}"
              timeout_ms: 1000
      - name: pfp-auth-me
        paths:
          - /auth/me
        strip_path: false
      - name: pfp-route
        paths:
          - /
        strip_path: false
  - name: pfp-public
    url: http://pfp-api-test:8000
    routes:
      - name: pfp-public-route
        paths:
          - "~/demo$"
          - "~/health/live$"
        regex_priority: 100
        strip_path: false
plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 120
      policy: local
      limit_by: ip

  - name: jwt
    service: pfp-api
    config:
      key_claim_name: kid
      claims_to_verify:
        - exp

